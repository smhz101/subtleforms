name: Tests

# Unit tests (PHPUnit + Jest) and real-browser tests against WordPress
# (Playwright, including the axe-core accessibility checks of every field
# type). Runs on every push and pull request.

# Pushes to feature branches are covered by the pull_request event, so push
# only runs for main. Without this every commit on a pull request ran the whole
# suite twice (once for push, once for pull_request).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same pull request cancels the older run. Runs on main
# are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    name: Unit tests (PHPUnit and Jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Composer cache dir
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHPUnit
        run: vendor/bin/phpunit --testsuite unit --no-coverage

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci --legacy-peer-deps

      - name: Jest
        run: npm test

  # The browser suite runs as two shards in parallel and starts without waiting
  # for the unit job. The job named "Browser and accessibility tests (WordPress
  # + Playwright + axe)" below is a gate that reports the combined result under
  # the original check name, so a required check of that name keeps working.
  browser-shard:
    name: Browser shard ${{ matrix.shard }} of 2
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      SF_BASE_URL: http://localhost:8888
      SF_ADMIN_USER: admin
      SF_ADMIN_PASS: password
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Composer cache dir
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - run: composer install --no-interaction --prefer-dist --no-progress

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci --legacy-peer-deps

      - name: Build assets
        run: npm run build:all

      - name: Start WordPress (wp-env)
        run: |
          npx --yes @wordpress/env@10 start
          npx --yes @wordpress/env@10 run cli wp rewrite structure '/%postname%/' --hard
          npx --yes @wordpress/env@10 run cli wp plugin list

      - name: PHPUnit inside WordPress
        if: matrix.shard == 1
        run: |
          npx --yes @wordpress/env@10 run cli --env-cwd=wp-content/plugins/subtleforms \
            bash -c 'WP_LOAD=/var/www/html/wp-load.php WP_HOST=localhost:8888 php vendor/bin/phpunit -c phpunit-wp.xml.dist'

      - name: Playwright version
        id: pw
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Playwright (browser tests and axe)
        run: npx playwright test -c playwright.browser.config.js --shard=${{ matrix.shard }}/2

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/browser
            test-results
          retention-days: 14

      - name: Stop WordPress
        if: always()
        run: npx --yes @wordpress/env@10 stop

  browser:
    name: Browser and accessibility tests (WordPress + Playwright + axe)
    runs-on: ubuntu-latest
    needs: browser-shard
    if: always()
    steps:
      - name: Require every shard to pass
        env:
          RESULT: ${{ needs.browser-shard.result }}
        run: |
          echo "Browser shards: $RESULT"
          test "$RESULT" = "success"
